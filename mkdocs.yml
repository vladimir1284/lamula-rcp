site_name: LAMULA RCP
site_description: Radar Control Processor & Operator MMI para el radar meteorológico Gematronik
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Inicio: index.md
  - Alcance:
      - Contexto: alcance/contexto.md
      - Decisiones de diseño: alcance/decisiones.md
      - Pendientes: alcance/pendientes.md
  - Implementación:
      - Fases: implementacion/fases.md
  - Referencia:
      - Project Plan: referencia/project-plan.md
